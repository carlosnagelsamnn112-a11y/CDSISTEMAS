<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Registro y seguimiento de objetivos de mercado (potenciales y clientes) de CDSISTEMAS.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#020304">
  <title>Objetivos de mercado — CD Sistemas</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* ============================================================
       BASE
    ============================================================ */
    :root {
      --text: var(--ink);
      --muted: var(--ink-soft);
      --label: var(--ink-soft);
      --panel: var(--bg-panel);
      --ok: #8fc99a;
      --danger: #cf9292;
      --danger-hover: #f0b4b4;
      --focus: var(--accent);
      color-scheme: dark;
    }

    [hidden] { display: none !important; }

    html, body {
      background: #0b0d10 !important;
    }
    body {
      min-height: 100vh;
    }
    .top-shell {
      background: #0b0d10;
    }
    .site-header {
      background: #0b0d10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .app-main {
      position: relative;
      z-index: 2;
      min-height: calc(100vh - 110px);
      padding: 48px 24px 80px;
      display: flex;
      justify-content: center;
      background: #0b0d10;
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      position: relative;
    }

    .btn-outline,
    .btn-ghost,
    .btn-danger,
    .enlace-fila {
      background: transparent !important;
    }
    .btn-outline:hover,
    .btn-ghost:hover,
    .btn-danger:hover {
      background: transparent !important;
    }

    .pantalla h1 {
      font-family: var(--font-body);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: none;
      color: var(--ink);
      margin: 0 0 8px;
      text-align: left;
      line-height: 1.15;
    }
    .pantalla h1::after { display: none; }

    .eyebrow-app {
      font-family: var(--font-display);
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--ink-soft);
      text-transform: uppercase;
      margin: 0 0 16px;
    }

    .lead-app {
      color: var(--ink-soft);
      margin: 0 0 36px;
      max-width: 46ch;
      font-size: 16px;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .acciones-detalle {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-danger {
      border-color: rgba(207, 146, 146, 0.45);
      color: var(--danger-hover);
    }
    .btn-danger:hover {
      border-color: var(--danger-hover);
      background: rgba(207, 146, 146, 0.08);
      color: #fff;
    }

    .volver { margin-top: 28px; }

    /* ============================================================
       CONFIRMACIÓN EN PÁGINA (sustituye a window.confirm)
    ============================================================ */
    .confirmacion {
      width: 100%;
      max-width: 480px;
      margin-top: 1.6rem;
      border: 1px solid #3a2b2b;
      border-radius: 6px;
      padding: 1.2rem 1.4rem 1rem;
      text-align: center;
      background: rgba(217, 138, 138, 0.05);
    }

    .confirmacion-texto {
      margin: 0 0 0.9rem;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
    }

    .confirmacion-botones {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .confirmacion-botones .peligro { color: var(--danger-hover); }
    .confirmacion-botones .peligro:hover { color: #ffd0d0; }

    /* ============================================================
       PANTALLAS
    ============================================================ */
    .pantalla {
      display: none;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
    }
    .pantalla.activa { display: flex; animation: aparecer 0.35s ease; }

    .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: flex-start;
    }

    /* ============================================================
       TARJETAS / RECUADROS
    ============================================================ */
    .card {
      width: 100%;
      max-width: none;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 28px 28px 24px;
      margin-bottom: 20px;
      background: rgba(10, 13, 18, 0.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }
    .card:hover::before { transform: scaleX(1); }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 20px;
      padding-right: 168px;
    }

    .card-copiar,
    .card-wa {
      position: absolute;
      top: 12px;
      z-index: 2;
      padding: 6px 12px;
      font-size: 11px;
    }
    .card-copiar { right: 12px; }
    .card-wa { right: 88px; }

    .card-mensaje-texto {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink-soft);
      white-space: pre-line;
      margin: 0;
    }

    #detalle-propuesta {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px;
      resize: vertical;
    }

    /* ============================================================
       FORMULARIO
    ============================================================ */
    .formulario {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
    }

    .fila {
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--line);
    }
    .fila:last-child { border-bottom: none; }
    .fila:focus-within { border-color: var(--focus); }

    .detalle .fila label {
      white-space: normal;
      width: min(200px, 42%);
    }

    .fila label {
      width: 140px;
      flex-shrink: 0;
      white-space: nowrap;
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .campo {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .fila input,
    .fila select {
      width: 100%;
      min-width: 0;
      padding: 0.9rem 0;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--ink);
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
    }

    .fila select option {
      background: #161616;
      color: var(--ink);
    }

    /* ============================================================
       DETALLE
    ============================================================ */
    .detalle {
      display: flex;
      flex-direction: column;
      width: 100%;
      align-items: stretch;
    }

    .detalle-nombre {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin: 0 0 1.6rem;
      text-align: left;
      word-break: break-word;
    }

    .dato {
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--line);
    }
    .dato:last-child { border-bottom: none; }

    .dato-titulo {
      width: 140px;
      flex-shrink: 0;
      white-space: nowrap;
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .dato-valor {
      flex: 1;
      min-width: 0;
      padding: 0.9rem 0;
      font-size: 0.95rem;
      word-break: break-word;
    }

    /* ============================================================
       ACCIONES Y MENSAJES
    ============================================================ */
    .acciones {
      margin-top: 1rem;
      text-align: left;
    }

    .mensaje {
      margin: 1.2rem 0 0;
      font-size: 0.85rem;
      color: var(--ink-soft);
      text-align: left;
      min-height: 1rem;
    }
    .mensaje.error { color: var(--danger-hover); }
    .mensaje.ok    { color: var(--ok); }

    .fila.es-error { border-bottom-color: var(--danger); }
    .error-campo {
      display: none;
      width: 100%;
      margin: 0;
      padding: 0 0 0.55rem;
      font-size: 0.75rem;
      color: var(--danger-hover);
    }
    .fila.es-error .error-campo { display: block; }

    .barra-lista {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem 1.2rem;
      margin-bottom: 1.2rem;
    }
    .buscar {
      flex: 1;
      min-width: 160px;
      padding: 12px 0;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--ink);
      background: none;
      border: none;
      border-bottom: 1px solid var(--line-strong);
      outline: none;
    }
    .buscar:focus { border-color: var(--ink); }
    .buscar::placeholder { color: var(--ink-soft); }

    .aviso {
      max-width: none;
      margin: 24px 0 0;
      border: 1px solid rgba(207, 146, 146, 0.35);
      border-radius: 6px;
      padding: 0.9rem 1.1rem;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--danger-hover);
      text-align: left;
      background: var(--panel);
    }

    .estado-nube {
      margin: 20px 0 0;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .aviso-nube {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 50;
      max-width: 520px;
      margin: 0 auto;
      border: 1px solid rgba(207, 146, 146, 0.45);
      border-radius: 6px;
      padding: 0.9rem 1.1rem;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--danger-hover);
      background: #14181c;
      text-align: center;
    }

    /* ============================================================
       TABLA
    ============================================================ */
    #contenedor-tabla {
      width: 100%;
      overflow-x: auto;
    }

    .tabla {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .tabla th {
      text-align: left;
      padding: 0 0 0.8rem;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .tabla td {
      padding: 1rem 0;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabla th:nth-child(1), .tabla td:nth-child(1) { width: 30%; padding-right: 0.6rem; }
    .tabla th:nth-child(2), .tabla td:nth-child(2) { width: 20%; padding-right: 0.6rem; }
    .tabla th:nth-child(3), .tabla td:nth-child(3) { width: 26%; padding-right: 0.6rem; }
    .tabla th:nth-child(4), .tabla td:nth-child(4) { width: 24%; text-align: right; }

    .tabla.con-accion th:nth-child(1), .tabla.con-accion td:nth-child(1) { width: 26%; }
    .tabla.con-accion th:nth-child(2), .tabla.con-accion td:nth-child(2) { width: 17%; }
    .tabla.con-accion th:nth-child(3), .tabla.con-accion td:nth-child(3) { width: 20%; }
    .tabla.con-accion th:nth-child(4), .tabla.con-accion td:nth-child(4) { width: 15%; text-align: left; padding-right: 0.6rem; }
    .tabla.con-accion th:nth-child(5), .tabla.con-accion td:nth-child(5) { width: 22%; text-align: right; }

    .estado-envio { font-size: 0.8rem; }
    .tabla td.estado-envio.es-enviado { color: var(--ok); }
    .tabla td.estado-envio.es-en-curso { color: var(--ink); }

    .tabla td:nth-child(2),
    .tabla td:nth-child(3),
    .tabla td:nth-child(4) { color: var(--muted); }

    .tabla tbody tr { transition: color 0.2s ease; }
    .enlace-fila {
      display: block;
      max-width: 100%;
      border: 0;
      cursor: pointer;
      font: inherit;
      letter-spacing: 0;
      text-transform: none;
      font-size: inherit;
      color: inherit;
      padding: 0;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .enlace-fila:hover { color: #fff; }

    .vacio {
      font-size: 0.88rem;
      color: var(--muted);
      text-align: center;
      margin: 1.4rem 0 0;
    }

    /* ============================================================
       BARRA DE VOLVER (fija bajo el encabezado)
    ============================================================ */
    .barra-volver {
      background: #0b0d10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .barra-volver-inner {
      max-width: 768px;
      margin: 0 auto;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .barra-volver .btn { flex-shrink: 0; }
    .ruta {
      min-width: 0;
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ============================================================
       ENVÍO DE MENSAJES
    ============================================================ */
    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 1.4rem;
    }
    .filtros .btn.activo {
      border-color: var(--ink);
      color: var(--ink);
    }

    .orden {
      padding: 12px 0;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--ink);
      background: none;
      border: none;
      border-bottom: 1px solid var(--line-strong);
      outline: none;
      cursor: pointer;
    }
    .orden option { background: #161616; color: var(--ink); }

    .card-envio {
      margin: 16px 0 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-envio.es-enviado {
      border-color: rgba(143, 201, 154, 0.5);
      color: var(--ok);
    }
    .card.card-enviada { border-color: rgba(143, 201, 154, 0.28); }
    .card.card-enviada .card-mensaje-texto,
    .card.card-enviada textarea { opacity: 0.6; }

    .resumen-cat { margin-top: 24px; }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 480px) {
      .pantalla h1 { font-size: 28px; }

      .fila,
      .dato {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.2rem;
        padding-top: 0.85rem;
      }
      .fila label,
      .dato-titulo {
        width: auto;
        padding-top: 0;
      }
      .campo,
      .fila input,
      .fila select,
      .dato-valor {
        width: 100%;
        padding: 0.3rem 0 0.85rem;
      }
      .fila input,
      .fila select { padding: 0.3rem 0 0.85rem; }

      /* la tabla conserva su rejilla y se desplaza en horizontal */
      .tabla { min-width: 400px; }

      .eliminar { margin-left: 1.2rem; }

      .barra-volver-inner { padding: 8px 16px; }
      .app-main { padding: 32px 16px 64px; }
    }

    /* ============================================================
       MOVIMIENTO REDUCIDO
    ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="top-shell">
    <header class="site-header">
      <div class="wrap header-row">
        <a class="brand" href="index.html">
          <img src="assets/logo.png" alt="CD Sistemas" class="brand-mark">
          <span class="brand-name">CD SISTEMAS</span>
        </a>
      </div>
    </header>
    <nav id="barra-volver" class="barra-volver" aria-label="Navegación" hidden>
      <div class="barra-volver-inner">
        <button type="button" class="btn btn-ghost" id="btn-atras" data-accion="atras">← Volver</button>
        <span id="ruta" class="ruta"></span>
      </div>
    </nav>
  </div>

  <main class="app-main">
  <div class="app-shell">

  <noscript>
    <p class="aviso">
      Esta aplicación necesita JavaScript para funcionar. El visor donde la estás
      abriendo está bloqueando los scripts: ábrela directamente en un navegador
      (Chrome, Edge o Firefox) para poder guardar registros.
    </p>
  </noscript>

  <!-- PANTALLA 1: menú principal -->
  <div id="pantalla-principal" class="pantalla activa">
    <h1>Estrategia Comercial</h1>
    <div class="botones">
      <button type="button" class="btn btn-primary" data-accion="categoria" data-arg="potenciales">Potenciales <span class="btn-arrow">→</span></button>
      <button type="button" class="btn btn-outline" data-accion="categoria" data-arg="clientes">Clientes <span class="btn-arrow">→</span></button>
    </div>
    <p id="aviso-almacenamiento" class="aviso" role="status" hidden></p>
    <p id="estado-nube" class="estado-nube" hidden></p>
  </div>

  <!-- PANTALLA 2: submenú Potenciales -->
  <div id="pantalla-potenciales" class="pantalla">
    <h1>Potenciales</h1>
    <div class="botones">
      <button type="button" class="btn btn-primary" data-accion="crear">Crear <span class="btn-arrow">→</span></button>
      <button type="button" class="btn btn-outline" data-accion="guardados">Guardados <span class="btn-arrow">→</span></button>
    </div>
    <p id="resumen-potenciales" class="estado-nube resumen-cat"></p>
  </div>

  <!-- PANTALLA 3: submenú Clientes -->
  <div id="pantalla-clientes" class="pantalla">
    <h1>Clientes</h1>
    <p class="lead-app">Negocios con los que ya hay relación comercial.</p>
    <div class="botones">
      <button type="button" class="btn btn-primary" data-accion="crear">Crear <span class="btn-arrow">→</span></button>
      <button type="button" class="btn btn-outline" data-accion="guardados">Guardados <span class="btn-arrow">→</span></button>
    </div>
    <p id="resumen-clientes" class="estado-nube resumen-cat"></p>
  </div>

  <!-- PANTALLA 4: Crear (sirve a Potenciales y a Clientes) -->
  <div id="pantalla-crear" class="pantalla">
    <h1 id="titulo-crear">Crear</h1>

    <form id="form-crear" class="formulario" autocomplete="off">
      <div class="card">
        <h2 class="card-title">Datos básicos</h2>

        <div class="fila">
          <label for="nombre">Nombre</label>
          <div class="campo">
            <input id="nombre" name="nombre" type="text" autocomplete="off" spellcheck="false" required aria-describedby="error-nombre">
            <p id="error-nombre" class="error-campo"></p>
          </div>
        </div>
        <div class="fila">
          <label for="telefono">Teléfono</label>
          <div class="campo">
            <input id="telefono" name="telefono" type="tel" autocomplete="off" spellcheck="false" required inputmode="tel" aria-describedby="error-telefono">
            <p id="error-telefono" class="error-campo"></p>
          </div>
        </div>
        <div class="fila">
          <label for="ciudad">Ciudad</label>
          <div class="campo">
            <input id="ciudad" name="ciudad" type="text" autocomplete="off" spellcheck="false" required aria-describedby="error-ciudad">
            <p id="error-ciudad" class="error-campo"></p>
          </div>
        </div>
        <div class="fila">
          <label for="departamento">Departamento</label>
          <!-- Las opciones van escritas en el HTML para que el formulario se vea
               completo aunque el entorno bloquee los scripts. Al arrancar, el
               script comprueba que coincidan con la configuración y, si no,
               las reconstruye. -->
          <div class="campo">
          <select id="departamento" name="departamento" required aria-describedby="error-departamento">
            <option value="">— Seleccionar —</option>
            <option value="Amazonas">Amazonas</option>
            <option value="Antioquia">Antioquia</option>
            <option value="Arauca">Arauca</option>
            <option value="Atlántico">Atlántico</option>
            <option value="Bogotá D.C.">Bogotá D.C.</option>
            <option value="Bolívar">Bolívar</option>
            <option value="Boyacá">Boyacá</option>
            <option value="Caldas">Caldas</option>
            <option value="Caquetá">Caquetá</option>
            <option value="Casanare">Casanare</option>
            <option value="Cauca">Cauca</option>
            <option value="Cesar">Cesar</option>
            <option value="Chocó">Chocó</option>
            <option value="Córdoba">Córdoba</option>
            <option value="Cundinamarca">Cundinamarca</option>
            <option value="Guainía">Guainía</option>

  <script src="sheets-config.js"></script>
