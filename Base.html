  <script>
    /* ============================================================
       CONFIGURACIÓN Y TEXTOS
       Este archivo está pensado para funcionar también dentro de
       visores restringidos:
       - No usa window.confirm ni window.alert (pueden estar bloqueados).
       - No usa onclick en línea (algunos visores los eliminan).
       - No depende del envío del formulario (puede estar bloqueado).
       - Si localStorage no está disponible, trabaja en memoria y avisa.
    ============================================================ */
    const ALMACEN = 'cdsistemas.objetivos.v2';
    const ALMACEN_ANTERIOR = 'cdsistemas.objetivos.v1';
    const ALMACEN_PENDIENTES = 'cdsistemas.objetivos.pendientes';

    const TEXTOS = {
      saludo: 'Buen día, le escribimos del equipo de ventas de CDSISTEMAS, un emprendimiento de soluciones y herramientas digitales para empresas, ubicado en Bucaramanga.',
      presencialSi: 'Como clientes que conocemos sus instalaciones, vemos una oportunidad de mejora en la que podemos aportar con nuestra propuesta.',
      presencialNo: 'Al conocer sus instalaciones, vemos una oportunidad de mejora en la que podemos aportar con nuestra propuesta.',
      virtualSi: 'Como clientes, vemos una oportunidad de mejora en la que podemos aportar con nuestra propuesta.',
      virtualNo: 'Al conocer su negocio, vemos una oportunidad de mejora en la que podemos aportar con nuestra propuesta.',
      contactoAtencion: 'Si no es este el contacto indicado, ¿podría decirnos a quién dirigir la propuesta?',
      agradecimiento: 'Agradecemos su tiempo. Quedamos atentos por si más adelante le interesa conocer nuestros servicios.',
      prueba: 'Para que conozca nuestro trabajo podemos acordar una prueba gratuita de una a dos semanas, con la que usted y su equipo podrán ver y aprender cómo funciona.',
      agendaSantander: 'Si le interesa, podemos agendar una reunión presencial o una llamada virtual para resolver dudas.',
      agendaFuera: 'Si le interesa, podemos agendar una llamada virtual para resolver dudas.'
    };

    const CONOCIMIENTOS = [
      { valor: 'presencial', texto: 'Presencial' },
      { valor: 'virtual', texto: 'Virtual' }
    ];

    const SI_NO = [
      { valor: 'si', texto: 'Sí' },
      { valor: 'no', texto: 'No' }
    ];

    const CONTACTOS = [
      { valor: 'admin', texto: 'Administrador' },
      { valor: 'atencion', texto: 'Atención al cliente' }
    ];

    const DEPARTAMENTOS = [
      'Amazonas', 'Antioquia', 'Arauca', 'Atlántico', 'Bogotá D.C.', 'Bolívar',
      'Boyacá', 'Caldas', 'Caquetá', 'Casanare', 'Cauca', 'Cesar', 'Chocó',
      'Córdoba', 'Cundinamarca', 'Guainía', 'Guaviare', 'Huila', 'La Guajira',
      'Magdalena', 'Meta', 'Nariño', 'Norte de Santander', 'Putumayo', 'Quindío',
      'Risaralda', 'San Andrés y Providencia', 'Santander', 'Sucre', 'Tolima',
      'Valle del Cauca', 'Vaupés', 'Vichada'
    ];

    const CATEGORIAS = {
      potenciales: { plural: 'Potenciales', singular: 'potencial' },
      clientes:    { plural: 'Clientes',    singular: 'cliente' }
    };

    const ETIQUETAS_CAMPO = {
      nombre: 'Nombre', telefono: 'Teléfono', ciudad: 'Ciudad',
      departamento: 'Departamento', fuente: 'Fuente', tipo: 'Tipo',
      conocimientos: 'Conocimientos', 'clientes-si': '¿Ya son clientes?',
      contacto: 'Contacto'
    };

    const LEGADO = {
      'Cliente / Presencial': 'presencial',
      'Cliente / Virtual': 'virtual',
      'Vista / Presencial': 'presencial',
      'Vista / Virtual': 'virtual',
      'cliente-presencial': 'presencial',
      'cliente-virtual': 'virtual',
      'vista-presencial': 'presencial',
      'vista-virtual': 'virtual',
      'Atencion al cliente': 'atencion',
      'Atención al cliente': 'atencion',
      Admin: 'admin',
      Administrador: 'admin'
    };

    /* ============================================================
       ESTADO
    ============================================================ */
    let datos = { potenciales: [], clientes: [] };
    let categoriaActual = 'potenciales';
    let idActual = null;          // registro abierto en el detalle
    let modoEdicion = false;
    let almacenamientoOk = true;
    let avisoAlmacen = '';

    /* ============================================================
       UTILIDADES DE DOM
    ============================================================ */
    function $(id) { return document.getElementById(id); }

    function ponerTexto(elemento, valor) {
      if (elemento) elemento.textContent = valor == null ? '' : String(valor);
    }

    function mostrar(elemento, visible) {
      if (!elemento) return;
      if (visible) elemento.removeAttribute('hidden');
      else elemento.setAttribute('hidden', '');
    }

    /* ============================================================
       MENSAJES AUTOMÁTICOS
    ============================================================ */
    function etiquetaLista(lista, valor) {
      const c = lista.find(x => x.valor === valor);
      return c ? c.texto : (valor || '');
    }

    function etiquetaConocimiento(valor) { return etiquetaLista(CONOCIMIENTOS, valor); }
    function etiquetaContacto(valor) { return etiquetaLista(CONTACTOS, valor); }
    function etiquetaSiNo(valor) { return etiquetaLista(SI_NO, valor); }

    function segundoMensaje(registro) {
      const pres = registro.conocimientos === 'presencial';
      const cli = registro.clientesSi === 'si';
      if (pres && cli) return TEXTOS.presencialSi;
      if (pres && !cli) return TEXTOS.presencialNo;
      if (!pres && cli) return TEXTOS.virtualSi;
      return TEXTOS.virtualNo;
    }

    function enSantander(departamento) {
      return String(departamento || '').trim().toLowerCase() === 'santander';
    }

    function propuestaBorrador(registro) {
      const r = registro || {};
      const nombre = String(r.nombre || 'su negocio').trim();
      const tipo = String(r.tipo || 'su tipo de negocio').trim();
      return 'Para ' + nombre + ', como ' + tipo + ', podemos dejarle una herramienta digital a la medida (pedidos, agenda, inventario o lo que más les quite tiempo), con una prueba gratis de una a dos semanas para que usted y su equipo vean cómo funciona.';
    }

    function bloquesMensaje(registro) {
      const r = registro || {};
      const bloques = [
        { clave: 'saludo', titulo: 'Primer mensaje', texto: TEXTOS.saludo },
        { clave: 'segundo', titulo: 'Segundo mensaje', texto: segundoMensaje(r) }
      ];
      if (r.contacto === 'atencion') {
        bloques.push({ clave: 'contacto', titulo: 'Mensaje de contacto', texto: TEXTOS.contactoAtencion });
      }
      bloques.push({ tipo: 'oferta' });
      if (r.oferta === 'no') {
        bloques.push({ clave: 'agradecimiento', titulo: 'Mensaje de agradecimiento', texto: TEXTOS.agradecimiento });
        return bloques;
      }
      bloques.push({
        clave: 'propuesta',
        titulo: 'Propuesta',
        texto: String(r.propuesta || '').trim(),
        editable: true
      });
      bloques.push({ clave: 'prueba', titulo: 'Prueba', texto: TEXTOS.prueba });
      bloques.push({
        clave: 'agenda',
        titulo: 'Agenda',
        texto: enSantander(r.departamento) ? TEXTOS.agendaSantander : TEXTOS.agendaFuera
      });
      return bloques;
    }

    /* ============================================================
       ENVÍO DE MENSAJES
       registro.enviados = { clave: fecha ISO } de cada mensaje enviado.
    ============================================================ */
    const CLAVES_MENSAJE = ['saludo', 'segundo', 'contacto', 'agradecimiento', 'propuesta', 'prueba', 'agenda'];
    const ESTADOS_ENVIO = {
      pendiente: 'Por enviar',
      'en-curso': 'En curso',
      enviado: 'Enviados'
    };

    function leerEnviados(valor) {
      let obj = valor;
      if (typeof valor === 'string') {
        try { obj = valor.trim() ? JSON.parse(valor) : {}; } catch (e) { obj = {}; }
      }
      const out = {};
      if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
        Object.keys(obj).forEach(k => {
          if (CLAVES_MENSAJE.indexOf(k) !== -1 && obj[k]) out[k] = String(obj[k]);
        });
      }
      return out;
    }

    /* Solo cuentan los mensajes que aplican a este registro y tienen texto. */
    function resumenEnvio(registro) {
      const r = registro || {};
      const claves = bloquesMensaje(r).filter(b => b.clave && b.texto).map(b => b.clave);
      const enviados = claves.filter(k => r.enviados && r.enviados[k]).length;
      const estado = !enviados ? 'pendiente' : (enviados >= claves.length ? 'enviado' : 'en-curso');
      return { total: claves.length, enviados: enviados, estado: estado };
    }

    function textoEstadoEnvio(resumen) {
      if (resumen.estado === 'enviado') return 'Enviado ✓';
      if (resumen.estado === 'en-curso') return resumen.enviados + ' de ' + resumen.total;
      return 'Por enviar';
    }

    function ultimoEnvio(registro) {
      const fechas = Object.values((registro && registro.enviados) || {});
      return fechas.length ? fechas.sort().pop() : '';
    }

    function registroAbierto() {
      return datos[categoriaActual].find(c => c.id === idActual) || null;
    }

    function marcarEnviado(clave, enviado) {
      const r = registroAbierto();
      if (!r || CLAVES_MENSAJE.indexOf(clave) === -1) return null;
      r.enviados = Object.assign({}, r.enviados);
      if (enviado) r.enviados[clave] = new Date().toISOString();
      else delete r.enviados[clave];
      guardarDatos(opGuardar(categoriaActual, r));
      pintarProgresoDetalle(r);
      return r.enviados[clave] || '';
    }

    function pintarBotonEnvio(card, btn, fecha) {
      const enviado = !!fecha;
      card.classList.toggle('card-enviada', enviado);
      btn.classList.toggle('es-enviado', enviado);
      btn.setAttribute('aria-pressed', enviado ? 'true' : 'false');
      btn.textContent = enviado ? '✓ Enviado · ' + fechaLegible(fecha) : 'Marcar como enviado';
      btn.title = enviado ? 'Clic para desmarcar' : '';
    }

    /* Botón al pie de cada mensaje. Devuelve una función para marcarlo
       desde otro botón (WhatsApp). */
    function botonEnvio(card, clave, registro) {
      const fila = document.createElement('div');
      fila.className = 'card-envio';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-ghost btn-envio';
      pintarBotonEnvio(card, btn, registro.enviados && registro.enviados[clave]);
      btn.addEventListener('click', () => {
        const r = registroAbierto();
        const yaEnviado = !!(r && r.enviados && r.enviados[clave]);
        pintarBotonEnvio(card, btn, marcarEnviado(clave, !yaEnviado));
      });
      fila.appendChild(btn);
      card.appendChild(fila);
      return () => {
        const r = registroAbierto();
        if (r && r.enviados && r.enviados[clave]) return;
        pintarBotonEnvio(card, btn, marcarEnviado(clave, true));
      };
    }

    function pintarProgresoDetalle(registro) {
      const el = $('detalle-progreso');
      if (!el) return;
      const res = resumenEnvio(registro);
      ponerTexto(el, res.enviados + ' de ' + res.total + ' enviados' +
        (res.estado === 'enviado' ? ' ✓' : ''));
    }

    function armarMensaje(registro) {
      return bloquesMensaje(registro)
        .map(b => b.texto)
        .filter(Boolean)
        .join('\n\n');
    }

    function textoHastaUltimoPunto(texto) {
      const s = String(texto || '').trim();
      const i = s.lastIndexOf('.');
      if (i === -1) return s;
      return s.slice(0, i + 1).trim();
    }

    /* Texto comparable: sin tildes, minúsculas y espacios simples. */
    function sinAcentos(texto) {
      return String(texto || '')
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function soloDigitos(texto) {
      return String(texto || '').replace(/\D/g, '');
    }

    function fechaLegible(iso) {
      if (!iso) return '—';
      const f = new Date(iso);
      if (isNaN(f.getTime())) return String(iso);
      return f.toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function numeroWhatsApp(tel) {
      let d = String(tel || '').replace(/\D/g, '');
      if (d.length === 10) d = '57' + d;
      return d;
    }

    function botonCopiarBloque(card, obtenerTexto) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-ghost card-copiar';
      btn.textContent = 'Copiar';
      btn.addEventListener('click', () => {
        copiarTexto(textoHastaUltimoPunto(obtenerTexto()), $('mensaje-detalle'));
      });
      card.appendChild(btn);
    }

    function botonWhatsApp(card, obtenerTexto, telefono, alEnviar) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn btn-ghost card-wa';
      btn.textContent = 'WhatsApp';
      btn.addEventListener('click', () => {
        const n = numeroWhatsApp(telefono);
        const t = textoHastaUltimoPunto(obtenerTexto());
        const msg = $('mensaje-detalle');
        if (!n || n.length < 11) {
          if (msg) {
            msg.classList.remove('ok');
            msg.classList.add('error');
            msg.textContent = 'Falta un teléfono válido para WhatsApp.';
          }
          return;
        }
        if (!t) {
          if (msg) {
            msg.classList.remove('ok');
            msg.classList.add('error');
            msg.textContent = 'El mensaje está vacío.';
          }
          return;
        }
        window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(t), '_blank', 'noopener');
        if (alEnviar) alEnviar();   // abrir WhatsApp marca el mensaje como enviado
      });
      card.appendChild(btn);
    }

    function accionesMensaje(card, obtenerTexto, telefono, alEnviar) {
      botonWhatsApp(card, obtenerTexto, telefono, alEnviar);
      botonCopiarBloque(card, obtenerTexto);
    }

    function generarMensaje(conocimientos, contacto, extra) {
      return armarMensaje(Object.assign({ conocimientos: conocimientos, contacto: contacto }, extra || {}));
    }

    /* ============================================================
       DATOS: CARGA, SEMILLA Y PERSISTENCIA
    ============================================================ */
    function idNuevo() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }

    function inferirClientesSi(registro) {
      if (registro.clientesSi === 'si' || registro.clientesSi === 'no') return registro.clientesSi;
      const raw = String(registro.conocimientos || '');
      if (/cliente/i.test(raw)) return 'si';
      if (/vista/i.test(raw)) return 'no';
      return '';
    }

    function normalizar(c) {
      const registro = c || {};
      const conocimientos = LEGADO[registro.conocimientos] || registro.conocimientos || '';
      return {
        id: registro.id || idNuevo(),
        nombre:        String(registro.nombre        || '').trim(),
        telefono:      String(registro.telefono      || '').trim(),
        ciudad:        String(registro.ciudad        || '').trim(),
        departamento:  String(registro.departamento  || '').trim(),
        fuente:        String(registro.fuente        || '').trim(),
        tipo:          String(registro.tipo          || '').trim(),
        conocimientos: conocimientos === 'presencial' || conocimientos === 'virtual' ? conocimientos : (LEGADO[conocimientos] || ''),
        clientesSi:    inferirClientesSi(registro),
        contacto:      LEGADO[registro.contacto] || registro.contacto || '',
        oferta:        registro.oferta === 'no' ? 'no' : (registro.oferta === 'si' ? 'si' : ''),
        propuesta:     String(registro.propuesta || '').trim(),
        enviados:      leerEnviados(registro.enviados),
        creado:        String(registro.creado || '').trim(),
        actualizado:   String(registro.actualizado || '').trim()
      };
    }

    function semilla() {
      const lista = Array.isArray(window.SEMILLA_POTENCIALES) ? window.SEMILLA_POTENCIALES : [];
      return {
        potenciales: lista.map(normalizar),
        clientes: []
      };
    }

    /* ============================================================
       NUBE (Google Sheets) — opcional
       Si sheets-config.js no tiene la URL /exec, todo sigue
       funcionando en localStorage como antes.
       Con el script v2 cada cambio se envía como una operación de
       UN registro (guardar / eliminar) en una cola que se reintenta
       sola; con el script antiguo se envía la copia completa.
    ============================================================ */
    const URL_HOJA = window.CD_SHEETS && window.CD_SHEETS.url
      ? String(window.CD_SHEETS.url).trim()
      : '';
    let nubeActiva = false;
    let nubeOps = false;          // el script soporta operaciones por registro (v2)
    let cargandoNube = false;
    let pendientes = [];          // operaciones aún no confirmadas por la hoja
    let enviando = false;
    let reintento = null;
    let colaCompleta = Promise.resolve();

    function nubeConfigurada() {
      /* http://localhost solo para pruebas locales con un servidor simulado. */
      return (URL_HOJA.indexOf('https://') === 0 || /^http:\/\/localhost[:/]/.test(URL_HOJA)) &&
        URL_HOJA.indexOf('PEGA_AQUI') === -1;
    }

    function copiaPlana(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function avisoNube(texto) {
      const aviso = $('aviso-nube');
      if (!aviso) return;
      ponerTexto(aviso, texto);
      mostrar(aviso, !!texto);
      if (texto) window.setTimeout(() => mostrar(aviso, false), 6000);
    }

    function vaciarAlmacen() {
      if (!almacenamientoOk) return;
      try {
        window.localStorage.removeItem(ALMACEN_ANTERIOR);
      } catch (e) { /* visor restringido */ }
    }

    /* Comprueba si el navegador permite guardar datos. */
    function probarAlmacenamiento() {
      try {
        const prueba = '__prueba_cdsistemas__';
        window.localStorage.setItem(prueba, '1');
        window.localStorage.removeItem(prueba);
        return true;
      } catch (e) {
        return false;
      }
    }

    function leerLocal(clave) {
      if (!almacenamientoOk) return null;
      try {
        return window.localStorage.getItem(clave);
      } catch (e) {
        almacenamientoOk = false;
        return null;
      }
    }

    function escribirLocal(clave, valor) {
      if (!almacenamientoOk) return false;
      try {
        window.localStorage.setItem(clave, valor);
        return true;
      } catch (e) {
        return false;
      }
    }

    /* conSemilla = false cuando hay hoja configurada: sin copia local no se
       inventan registros (tendrían ids nuevos y se duplicarían en la hoja). */
    function cargarLocal(conSemilla) {
      const respaldo = () => conSemilla ? semilla() : { potenciales: [], clientes: [] };
      const bruto = leerLocal(ALMACEN);
      if (!bruto) return respaldo();

      try {
        return normalizarListas(JSON.parse(bruto) || {});
      } catch (e) {
        avisoAlmacen = conSemilla
          ? 'Los datos guardados están dañados. Se restauró la lista de potenciales de respaldo. Exporta antes de guardar si necesitas el archivo anterior.'
          : 'La copia local estaba dañada; se usarán los datos de Google Sheets.';
        return respaldo();
      }
    }

    function normalizarListas(obj) {
      return {
        potenciales: Array.isArray(obj && obj.potenciales) ? obj.potenciales.map(normalizar) : [],
        clientes:    Array.isArray(obj && obj.clientes)    ? obj.clientes.map(normalizar)    : []
      };
    }

    async function leerHoja() {
      const res = await fetch(URL_HOJA, { method: 'GET', redirect: 'follow' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const obj = await res.json();
      if (!obj || obj.ok === false) throw new Error((obj && obj.error) || 'Respuesta inválida');
      return obj;
    }

    async function cargarNube() {
      const obj = await leerHoja();
      nubeOps = Number(obj.version) >= 2;
      const cargado = normalizarListas(obj);
      /* v2: solo se siembra si la hoja nunca se usó (sin encabezados), así
         borrar todos los registros no vuelve a traer la lista de respaldo. */
      const sinIniciar = nubeOps
        ? obj.inicializada === false
        : (!cargado.potenciales.length && !cargado.clientes.length);
      if (sinIniciar) {
        const inicial = semilla();
        await enviarHoja(nubeOps ? { accion: 'reemplazar', datos: inicial } : inicial);
        return inicial;
      }
      /* Cambios hechos sin conexión: se muestran ya y se envían después. */
      if (nubeOps) pendientes.forEach(op => aplicarOp(cargado, op));
      return cargado;
    }

    function enviarHoja(payload) {
      return fetch(URL_HOJA, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(copiaPlana(payload))
      }).then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
    }

    /* --- Operaciones por registro --- */
    function opGuardar(categoria, registro) {
      const ahora = new Date().toISOString();
      if (!registro.creado) registro.creado = ahora;
      registro.actualizado = ahora;
      return { accion: 'guardar', categoria: categoria, registro: copiaPlana(registro) };
    }

    function opEliminar(id) {
      return { accion: 'eliminar', id: id };
    }

    function aplicarOp(base, op) {
      if (!op) return;
      const quitar = id => Object.keys(CATEGORIAS).forEach(cat => {
        base[cat] = base[cat].filter(r => r.id !== id);
      });
      if (op.accion === 'eliminar') quitar(op.id);
      if (op.accion === 'guardar' && op.registro && base[op.categoria]) {
        quitar(op.registro.id);
        base[op.categoria].push(normalizar(op.registro));
      }
    }

    /* --- Cola de envío (persistida en el navegador) --- */
    function cargarPendientes() {
      try {
        const lista = JSON.parse(leerLocal(ALMACEN_PENDIENTES) || '[]');
        pendientes = Array.isArray(lista) ? lista : [];
      } catch (e) {
        pendientes = [];
      }
    }

    function guardarPendientes() {
      escribirLocal(ALMACEN_PENDIENTES, JSON.stringify(pendientes));
    }

    async function procesarPendientes() {
      if (enviando || !nubeActiva || !nubeOps || !pendientes.length) {
        actualizarEstadoNube();
        return;
      }
      enviando = true;
      window.clearTimeout(reintento);
      try {
        while (pendientes.length) {
          const respuesta = await enviarHoja(pendientes[0]);
          if (respuesta && respuesta.ok === false) {
            if (respuesta.reintentar) throw new Error(respuesta.error);
            avisoNube('Google Sheets rechazó un cambio: ' + (respuesta.error || 'sin detalle') + '.');
          }
          pendientes.shift();
          guardarPendientes();
        }
      } catch (e) {
        avisoNube('No se pudo guardar en Google Sheets. El cambio quedó en este navegador y se reenviará solo.');
        reintento = window.setTimeout(procesarPendientes, 20000);
      } finally {
        enviando = false;
        actualizarEstadoNube();
      }
    }

    /* Script antiguo: copia completa, en serie para que no se pisen. */
    function enviarCompleto() {
      colaCompleta = colaCompleta
        .then(() => enviarHoja(datos))
        .catch(() => {
          avisoNube('No se pudo guardar en Google Sheets. Revisa internet o vuelve a publicar el script.');
        });
    }

    function actualizarEstadoNube(textoFijo) {
      const el = $('estado-nube');
      if (!el || !nubeConfigurada()) return;
      let texto = textoFijo || (nubeActiva
        ? 'Guardando en Google Sheets'
        : 'Sin conexión a la hoja · guardado local');
      if (!textoFijo && pendientes.length) {
        texto += ' · ' + pendientes.length + (pendientes.length === 1 ? ' cambio por enviar' : ' cambios por enviar');
      }
      ponerTexto(el, texto);
      mostrar(el, true);
    }

    /* Copia local siempre al día (también con hoja: sirve de respaldo). */
    function guardarCopiaLocal() {
      if (!almacenamientoOk) return false;
      try {
        window.localStorage.setItem(ALMACEN, JSON.stringify(datos));
        return true;
      } catch (e) {
        almacenamientoOk = false;
        if (!nubeConfigurada()) mostrarAvisoAlmacenamiento();
        return false;
      }
    }

    /* op = operación del registro que cambió (opGuardar / opEliminar). */
    function guardarDatos(op) {
      const local = guardarCopiaLocal();
      if (!nubeConfigurada()) return local;
      if (nubeActiva && !nubeOps) {
        enviarCompleto();
        return true;
      }
      if (op) {
        pendientes.push(copiaPlana(op));
        guardarPendientes();
        procesarPendientes();
      }
      return nubeActiva || local;
    }

    function mostrarAvisoAlmacenamiento() {
      const aviso = $('aviso-almacenamiento');
      if (!aviso) return;
      ponerTexto(aviso, avisoAlmacen ||
        'Este entorno no permite guardar datos en el navegador: los registros se ' +
        'conservan mientras la página esté abierta, pero se pierden al recargarla. ' +
        'Para conservarlos, abre el archivo directamente en Chrome, Edge o Firefox.');
      mostrar(aviso, true);
    }

    /* ============================================================
       NAVEGACIÓN
    ============================================================ */
    /* opciones.scroll: número = posición a restaurar; false = no mover. */
    function irA(idPantalla, opciones) {
      const o = opciones || {};
      document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));

      const destino = $(idPantalla);
      if (destino) destino.classList.add('activa');

      ocultarConfirmacion();
      if (!o.conservarMensaje) limpiarMensaje();
      pintarBarraVolver(idPantalla);
      registrarHistorial(idPantalla);

      if (o.scroll === false) return;
      const y = typeof o.scroll === 'number' ? o.scroll : 0;
      try {
        window.scrollTo({ top: y, behavior: 'instant' });
      } catch (e) {
        try { window.scrollTo(0, y); } catch (e2) { /* algunos visores lo bloquean */ }
      }
    }

    function pantallaActual() {
      const p = document.querySelector('.pantalla.activa');
      return p ? p.id : 'pantalla-principal';
    }

    /* --- Barra de volver: siempre visible bajo el encabezado --- */
    function pintarBarraVolver(idPantalla) {
      const barra = $('barra-volver');
      if (!barra) return;
      const cat = CATEGORIAS[categoriaActual].plural;
      let ruta = '';
      if (idPantalla === 'pantalla-potenciales' || idPantalla === 'pantalla-clientes') ruta = cat;
      else if (idPantalla === 'pantalla-guardados') ruta = cat + ' / Guardados';
      else if (idPantalla === 'pantalla-crear') ruta = cat + ' / ' + (modoEdicion ? 'Editar' : 'Crear');
      else if (idPantalla === 'pantalla-detalle') {
        const r = registroAbierto();
        ruta = cat + ' / Guardados / ' + (r ? r.nombre : 'Detalle');
      }
      ponerTexto($('ruta'), ruta);
      mostrar(barra, idPantalla !== 'pantalla-principal');
    }

    /* Pantalla "padre" de la actual. */
    function destinoAtras() {
      const p = pantallaActual();
      const cat = categoriaActual;
      if (p === 'pantalla-potenciales' || p === 'pantalla-clientes') return { p: 'pantalla-principal' };
      if (p === 'pantalla-guardados') return { p: 'pantalla-' + cat, cat: cat };
      if (p === 'pantalla-crear') {
        return modoEdicion && idActual
          ? { p: 'pantalla-detalle', cat: cat, id: idActual }
          : { p: 'pantalla-' + cat, cat: cat };
      }
      if (p === 'pantalla-detalle') return { p: 'pantalla-guardados', cat: cat };
      return null;
    }

    /* --- Historial: el botón atrás del navegador/celular navega dentro
       de la app en vez de salir de la página. --- */
    let pilaHist = [];
    let indiceHist = 0;
    let restaurando = false;
    let reemplazarHist = false;
    let historialOk = false;

    function mismoEstado(a, b) {
      return !!a && !!b && a.p === b.p &&
        (a.cat || '') === (b.cat || '') && (a.id || '') === (b.id || '');
    }

    function prepararHistorial() {
      try {
        const e = { cd: 1, i: 0, p: 'pantalla-principal' };
        history.replaceState(e, '');
        pilaHist = [e];
        indiceHist = 0;
        historialOk = true;
      } catch (err) {
        historialOk = false;
        return;
      }
      window.addEventListener('popstate', evento => {
        const e = evento.state;
        if (!e || !e.cd) return;
        indiceHist = e.i || 0;
        restaurando = true;
        try { mostrarEstado(e, true); } finally { restaurando = false; }
      });
    }

    function registrarHistorial(idPantalla) {
      if (!historialOk || restaurando) return;
      const e = {
        cd: 1,
        p: idPantalla,
        cat: idPantalla === 'pantalla-principal' ? '' : categoriaActual,
        id: idPantalla === 'pantalla-detalle' || (idPantalla === 'pantalla-crear' && modoEdicion) ? idActual : '',
        edit: idPantalla === 'pantalla-crear' && modoEdicion
      };
      try {
        if (reemplazarHist || mismoEstado(pilaHist[indiceHist], e)) {
          e.i = indiceHist;
          history.replaceState(e, '');
          pilaHist[indiceHist] = e;
        } else {
          e.i = indiceHist + 1;
          history.pushState(e, '');
          indiceHist = e.i;
          pilaHist.length = indiceHist;
          pilaHist[indiceHist] = e;
        }
      } catch (err) { /* visor restringido: se navega sin historial */ }
    }

    function existeRegistro(cat, id) {
      return !!(id && datos[cat] && datos[cat].some(c => c.id === id));
    }

    function mostrarEstado(e, volviendo) {
      if (e.cat && CATEGORIAS[e.cat]) categoriaActual = e.cat;
      modoEdicion = false;
      switch (e.p) {
        case 'pantalla-detalle':
          if (existeRegistro(categoriaActual, e.id)) abrirDetalle(e.id);
          else abrirGuardados(volviendo);
          break;
        case 'pantalla-guardados':
          abrirGuardados(volviendo);
          break;
        case 'pantalla-crear':
          if (e.edit && existeRegistro(categoriaActual, e.id)) { idActual = e.id; irAEditar(); }
          else irACrear();
          break;
        case 'pantalla-potenciales':
        case 'pantalla-clientes':
          abrirCategoria(e.p.replace('pantalla-', ''));
          break;
        default:
          irA('pantalla-principal');
      }
    }

    /* Volver: si la pantalla anterior del historial es la "padre", se usa
       history.back(); si no, se navega a la padre reemplazando la entrada. */
    function irAtras() {
      const d = destinoAtras();
      if (!d) return false;
      const previo = pilaHist[indiceHist - 1];
      if (historialOk && indiceHist > 0 && mismoEstado(previo, { p: d.p, cat: d.cat || '', id: d.id || '' })) {
        try { history.back(); return true; } catch (err) { /* sigue abajo */ }
      }
      reemplazarHist = true;
      try { mostrarEstado(d, true); } finally { reemplazarHist = false; }
      return true;
    }

    function limpiarMensaje() {
      ['mensaje', 'mensaje-detalle'].forEach(id => {
        const msg = $(id);
        if (!msg) return;
        msg.textContent = '';
        msg.classList.remove('error', 'ok');
      });
    }

    function abrirCategoria(categoria) {
      if (!CATEGORIAS[categoria]) return;
      categoriaActual = categoria;
      idActual = null;
      pintarResumenCategoria();
      irA('pantalla-' + categoria);
    }

    /* "98 guardados · 40 por enviar · 3 en curso" bajo los botones. */
    function pintarResumenCategoria() {
      const el = $('resumen-' + categoriaActual);
      if (!el) return;
      const lista = datos[categoriaActual];
      const c = { pendiente: 0, 'en-curso': 0, enviado: 0 };
      lista.forEach(r => { c[resumenEnvio(r).estado] += 1; });
      ponerTexto(el, lista.length + (lista.length === 1 ? ' guardado' : ' guardados') +
        ' · ' + c.pendiente + ' por enviar · ' + c['en-curso'] + ' en curso · ' +
        c.enviado + (c.enviado === 1 ? ' enviado' : ' enviados'));
    }

    function volverASubmenu() {
      pintarResumenCategoria();
      irA('pantalla-' + categoriaActual);
    }

    function irACrear() {
      modoEdicion = false;
      idActual = null;
      limpiarErroresCampos();
      const formulario = $('form-crear');
      if (formulario && typeof formulario.reset === 'function') formulario.reset();
      ponerTexto($('titulo-crear'), CATEGORIAS[categoriaActual].plural + ' · Crear');
      ponerTexto($('btn-guardar'), 'Guardar');
      irA('pantalla-crear');
    }

    function irAEditar() {
      if (idActual === null) return;
      const cliente = datos[categoriaActual].find(c => c.id === idActual);
      if (!cliente) {
        abrirGuardados();
        return;
      }
      modoEdicion = true;
      limpiarErroresCampos();
      ['nombre', 'telefono', 'ciudad', 'departamento', 'fuente', 'tipo', 'conocimientos', 'contacto'].forEach(id => {
        const campo = $(id);
        if (campo) campo.value = cliente[id] || '';
      });
      const cli = $('clientes-si');
      if (cli) cli.value = cliente.clientesSi || '';
      ponerTexto($('titulo-crear'), CATEGORIAS[categoriaActual].plural + ' · Editar');
      ponerTexto($('btn-guardar'), 'Actualizar');
      irA('pantalla-crear');
    }

    /* ============================================================
       DESPLEGABLES
       Las opciones están escritas en el HTML; aquí solo se comprueba
       que coincidan con la configuración y se reconstruyen si no.
    ============================================================ */
    function llenarSelect(id, opciones, marcador) {
      const select = $(id);
      if (!select) return;
      select.innerHTML = '';

      if (marcador) {
        const vacio = document.createElement('option');
        vacio.value = '';
        vacio.textContent = marcador;
        select.appendChild(vacio);
      }

      opciones.forEach(opcion => {
        const el = document.createElement('option');
        el.value = opcion.valor;
        el.textContent = opcion.texto;
        select.appendChild(el);
      });
    }

    function sincronizarSelect(id, opciones, marcador) {
      const select = $(id);
      if (!select) return;

      const esperados = (marcador ? [''] : []).concat(opciones.map(o => o.valor));
      const actuales = Array.prototype.map.call(select.options, o => o.value);
      const coinciden = esperados.length === actuales.length &&
                        esperados.every((valor, i) => valor === actuales[i]);

      if (!coinciden) llenarSelect(id, opciones, marcador);
    }

    function prepararFormulario() {
      sincronizarSelect('departamento', DEPARTAMENTOS.map(d => ({ valor: d, texto: d })), '— Seleccionar —');
      sincronizarSelect('conocimientos', CONOCIMIENTOS, '— Seleccionar —');
      sincronizarSelect('clientes-si', SI_NO, '— Seleccionar —');
      sincronizarSelect('contacto', CONTACTOS, '— Seleccionar —');
    }

    /* ============================================================
       GUARDADOS
    ============================================================ */
    function textoBusqueda() {
      const campo = $('buscar-guardados');
      return campo ? sinAcentos(campo.value) : '';
    }

    /* Ignora tildes y mayúsculas; varias palabras deben aparecer todas.
       El teléfono se compara solo por dígitos (300 123 4567 = 3001234567). */
    function coincideBusqueda(cliente, q) {
      if (!q) return true;
      const texto = sinAcentos([
        cliente.nombre, cliente.telefono, cliente.ciudad, cliente.departamento,
        cliente.fuente, cliente.tipo
      ].join(' '));
      const digitos = soloDigitos(cliente.telefono);
      return q.split(' ').every(palabra => {
        if (texto.indexOf(palabra) !== -1) return true;
        const d = soloDigitos(palabra);
        return d.length >= 3 && d === palabra.replace(/[\s()+-]/g, '') && digitos.indexOf(d) !== -1;
      });
    }

    let filtroEnvio = 'todos';     // todos | pendiente | en-curso | enviado
    let scrollLista = 0;

    /* volviendo = true restaura la posición de la lista al regresar. */
    function abrirGuardados(volviendo) {
      modoEdicion = false;
      idActual = null;
      pintarGuardados();
      irA('pantalla-guardados', { scroll: volviendo ? scrollLista : 0 });
    }

    function ordenarLista(lista) {
      const orden = $('orden-guardados') ? $('orden-guardados').value : 'nombre';
      const porNombre = (a, b) =>
        String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es', { sensitivity: 'base' });
      if (orden === 'recientes') {
        return lista.sort((a, b) =>
          String(b.actualizado || b.creado || '').localeCompare(String(a.actualizado || a.creado || '')) || porNombre(a, b));
      }
      if (orden === 'envio') {
        return lista.sort((a, b) => ultimoEnvio(b).localeCompare(ultimoEnvio(a)) || porNombre(a, b));
      }
      return lista.sort(porNombre);
    }

    function pintarFiltros(conteos) {
      const cont = $('filtros-envio');
      if (!cont) return;
      cont.innerHTML = '';
      const opciones = [['todos', 'Todos']].concat(Object.keys(ESTADOS_ENVIO).map(k => [k, ESTADOS_ENVIO[k]]));
      opciones.forEach(([valor, texto]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-ghost' + (filtroEnvio === valor ? ' activo' : '');
        btn.setAttribute('data-accion', 'filtro');
        btn.setAttribute('data-arg', valor);
        btn.setAttribute('aria-pressed', filtroEnvio === valor ? 'true' : 'false');
        btn.textContent = texto + ' (' + (conteos[valor] || 0) + ')';
        cont.appendChild(btn);
      });
    }

    function pintarGuardados() {
      const categoria = CATEGORIAS[categoriaActual];
      const q = textoBusqueda();
      const lista = ordenarLista(datos[categoriaActual].slice());
      const buscada = lista.filter(c => coincideBusqueda(c, q));

      const conteos = { todos: buscada.length, pendiente: 0, 'en-curso': 0, enviado: 0 };
      const resumenes = {};
      buscada.forEach(c => {
        const res = resumenEnvio(c);
        resumenes[c.id] = res;
        conteos[res.estado] += 1;
      });
      const filtrada = filtroEnvio === 'todos'
        ? buscada
        : buscada.filter(c => resumenes[c.id].estado === filtroEnvio);
      const contenedor = $('contenedor-tabla');

      ponerTexto($('titulo-guardados'), categoria.plural + ' · Guardados (' +
        (filtrada.length !== lista.length ? filtrada.length + ' de ' + lista.length : lista.length) + ')');
      pintarFiltros(conteos);

      contenedor.innerHTML = '';

      if (lista.length === 0) {
        const vacio = document.createElement('p');
        vacio.className = 'vacio';
        vacio.textContent = 'No hay ' + categoria.plural.toLowerCase() + ' guardados.';
        contenedor.appendChild(vacio);
        return;
      }

      if (filtrada.length === 0) {
        const vacio = document.createElement('p');
        vacio.className = 'vacio';
        vacio.textContent = filtroEnvio !== 'todos' && buscada.length
          ? 'No hay registros en «' + ESTADOS_ENVIO[filtroEnvio] + '».'
          : 'Ningún registro coincide con la búsqueda.';
        contenedor.appendChild(vacio);
        return;
      }

      const tabla = document.createElement('table');
      tabla.className = 'tabla' + (categoriaActual === 'potenciales' ? ' con-accion' : '');
      tabla.setAttribute('aria-label', 'Listado de ' + categoria.plural.toLowerCase() + ' guardados');

      const thead = document.createElement('thead');
      const filaEncabezado = document.createElement('tr');
      const encabezados = categoriaActual === 'potenciales'
        ? ['Nombre', 'Teléfono', 'Ciudad', 'Mensajes', '']
        : ['Nombre', 'Teléfono', 'Ciudad', 'Mensajes'];
      encabezados.forEach(titulo => {
        const th = document.createElement('th');
        th.scope = 'col';
        th.textContent = titulo;
        filaEncabezado.appendChild(th);
      });
      thead.appendChild(filaEncabezado);
      tabla.appendChild(thead);

      const tbody = document.createElement('tbody');

      filtrada.forEach(cliente => {
        const fila = document.createElement('tr');

        const ciudadCompleta = [cliente.ciudad, cliente.departamento].filter(Boolean).join(', ');
        const res = resumenes[cliente.id];
        const valores = [cliente.nombre, cliente.telefono, ciudadCompleta, textoEstadoEnvio(res)];

        valores.forEach((valor, i) => {
          const td = document.createElement('td');
          td.title = valor;
          if (i === 3) {
            td.className = 'estado-envio es-' + res.estado;
            td.title = res.enviados + ' de ' + res.total + ' mensajes enviados';
          }
          if (i === 0) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'enlace-fila';
            btn.textContent = valor;
            btn.setAttribute('aria-label', 'Ver detalle de ' + cliente.nombre);
            btn.addEventListener('click', () => abrirDetalle(cliente.id));
            td.appendChild(btn);
          } else {
            td.textContent = valor;
          }
          fila.appendChild(td);
        });

        if (categoriaActual === 'potenciales') {
          const tdAcc = document.createElement('td');
          const btnPasar = document.createElement('button');
          btnPasar.type = 'button';
          btnPasar.className = 'btn btn-ghost';
          btnPasar.textContent = 'Pasar a cliente';
          btnPasar.setAttribute('aria-label', 'Pasar a cliente real: ' + cliente.nombre);
          btnPasar.addEventListener('click', () => {
            idActual = cliente.id;
            pasarACliente();
          });
          tdAcc.appendChild(btnPasar);
          fila.appendChild(tdAcc);
        }

        tbody.appendChild(fila);
      });

      tabla.appendChild(tbody);
      contenedor.appendChild(tabla);
    }

    /* ============================================================
       DETALLE
    ============================================================ */
    /* opciones = { scroll: false } para re-pintar sin saltar arriba. */
    function abrirDetalle(id, opciones) {
      const cliente = datos[categoriaActual].find(c => c.id === id);

      if (!cliente) {
        abrirGuardados();
        return;
      }

      const opcionesIr = opciones || {};
      if (pantallaActual() === 'pantalla-guardados') scrollLista = window.scrollY || 0;
      idActual = id;

      ponerTexto($('detalle-nombre'), cliente.nombre);

      const cont = $('detalle-contenido');
      cont.innerHTML = '';

      /* --- Recuadro: datos --- */
      const cardDatos = document.createElement('div');
      cardDatos.className = 'card';

      const tituloDatos = document.createElement('h2');
      tituloDatos.className = 'card-title';
      tituloDatos.textContent = 'Datos';
      cardDatos.appendChild(tituloDatos);

      const campos = [
        ['Nombre',        cliente.nombre],
        ['Teléfono',      cliente.telefono],
        ['Ciudad',        cliente.ciudad],
        ['Departamento',  cliente.departamento],
        ['Fuente',        cliente.fuente],
        ['Tipo',          cliente.tipo],
        ['Conocimientos', etiquetaConocimiento(cliente.conocimientos)],
        ['¿Ya son clientes?', etiquetaSiNo(cliente.clientesSi)],
        ['Contacto',      etiquetaContacto(cliente.contacto)],
        ['Mensajes',      '', 'detalle-progreso'],
        ['Creado',        fechaLegible(cliente.creado)],
        ['Actualizado',   fechaLegible(cliente.actualizado)]
      ];

      campos.forEach(([titulo, valor, idValor]) => {
        const fila = document.createElement('div');
        fila.className = 'dato';

        const tt = document.createElement('span');
        tt.className = 'dato-titulo';
        tt.textContent = titulo;

        const vv = document.createElement('span');
        vv.className = 'dato-valor';
        if (idValor) vv.id = idValor;
        vv.textContent = valor;

        fila.append(tt, vv);
        cardDatos.appendChild(fila);
      });

      cont.appendChild(cardDatos);

      bloquesMensaje(cliente).forEach(bloque => {
        const card = document.createElement('div');
        card.className = 'card';
        if (bloque.tipo === 'oferta') {
          const fila = document.createElement('div');
          fila.className = 'fila';
          const lab = document.createElement('label');
          lab.setAttribute('for', 'detalle-oferta');
          lab.textContent = '¿Quiere conocer la oferta?';
          const campo = document.createElement('div');
          campo.className = 'campo';
          const sel = document.createElement('select');
          sel.id = 'detalle-oferta';
          sel.innerHTML = '<option value="">— Seleccionar —</option><option value="si">Sí</option><option value="no">No</option>';
          sel.value = cliente.oferta || '';
          sel.addEventListener('change', guardarOfertaDetalle);
          campo.appendChild(sel);
          fila.append(lab, campo);
          card.appendChild(fila);
          cont.appendChild(card);
          return;
        }
        const tit = document.createElement('h2');
        tit.className = 'card-title';
        tit.textContent = bloque.titulo;
        card.appendChild(tit);
        if (bloque.editable) {
          const area = document.createElement('textarea');
          area.id = 'detalle-propuesta';
          area.rows = 4;
          area.style.width = '100%';
          area.placeholder = 'Campo vacío listo para llenar (propuesta según el tipo de negocio).';
          area.value = bloque.texto || '';
          const btnGen = document.createElement('button');
          btnGen.type = 'button';
          btnGen.className = 'btn btn-ghost';
          btnGen.style.marginTop = '10px';
          btnGen.textContent = 'Generar propuesta';
          btnGen.addEventListener('click', () => {
            area.value = propuestaBorrador(cliente);
          });
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn btn-ghost';
          btn.style.marginTop = '10px';
          btn.style.marginLeft = '8px';
          btn.textContent = 'Guardar propuesta';
          btn.addEventListener('click', guardarPropuestaDetalle);
          card.append(area, btnGen, btn);
          /* La propuesta solo se puede marcar cuando ya está guardada. */
          const marcar = bloque.texto ? botonEnvio(card, bloque.clave, cliente) : null;
          accionesMensaje(card, () => area.value, cliente.telefono, marcar);
        } else {
          const p = document.createElement('p');
          p.className = 'card-mensaje-texto';
          p.textContent = bloque.texto;
          card.appendChild(p);
          const marcar = botonEnvio(card, bloque.clave, cliente);
          accionesMensaje(card, () => p.textContent, cliente.telefono, marcar);
        }
        cont.appendChild(card);
      });
      pintarProgresoDetalle(cliente);

      const btnPasar = $('btn-pasar-cliente');
      mostrar(btnPasar, categoriaActual === 'potenciales');

      irA('pantalla-detalle', opcionesIr);
    }

    /* ============================================================
       ELIMINAR (confirmación dentro de la página, sin window.confirm)
    ============================================================ */
    function ocultarConfirmacion() {
      mostrar($('confirmacion'), false);
      mostrar($('btn-eliminar'), true);
    }

    function pedirEliminar() {
      if (idActual === null) return;

      const cliente = datos[categoriaActual].find(c => c.id === idActual);
      if (!cliente) {
        abrirGuardados();
        return;
      }

      ponerTexto($('confirmacion-texto'),
        '¿Eliminar a «' + cliente.nombre + '»? Esta acción no se puede deshacer.');

      mostrar($('btn-eliminar'), false);
      mostrar($('confirmacion'), true);

      const boton = $('btn-confirmar-eliminar');
      if (boton && typeof boton.focus === 'function') boton.focus();
    }

    function cancelarEliminar() {
      ocultarConfirmacion();
      const boton = $('btn-eliminar');
      if (boton && typeof boton.focus === 'function') boton.focus();
    }

    function confirmarEliminar() {
      if (idActual === null) {
        ocultarConfirmacion();
        return;
      }

      const lista = datos[categoriaActual];
      const indice = lista.findIndex(c => c.id === idActual);

      ocultarConfirmacion();
      idActual = null;

      if (indice === -1) {
        abrirGuardados();
        return;
      }

      const eliminado = lista.splice(indice, 1)[0];
      guardarDatos(opEliminar(eliminado.id));

      abrirGuardados();
    }

    /* ============================================================
       GUARDAR
    ============================================================ */
    function valorDe(id) {
      const campo = $(id);
      return campo ? campo.value.trim() : '';
    }

    function telefonoValido(valor) {
      const digitos = String(valor).replace(/\D/g, '');
      return digitos.length >= 7 && digitos.length <= 15;
    }

    /* Mismo nombre (sin tildes ni mayúsculas) y mismo teléfono (solo dígitos,
       sin el 57 inicial) = mismo negocio. */
    function claveDuplicado(registro) {
      let tel = soloDigitos(registro.telefono);
      if (tel.length === 12 && tel.indexOf('57') === 0) tel = tel.slice(2);
      return sinAcentos(registro.nombre) + '|' + tel;
    }

    /* Busca en Potenciales y en Clientes; devuelve el registro repetido. */
    function buscarDuplicado(registro, exceptId) {
      const clave = claveDuplicado(registro);
      for (const cat of Object.keys(CATEGORIAS)) {
        const igual = datos[cat].find(c => c.id !== exceptId && claveDuplicado(c) === clave);
        if (igual) return { categoria: cat, registro: igual };
      }
      return null;
    }

    function marcarErrorCampo(id, texto) {
      const campo = $(id);
      const fila = campo && campo.closest ? campo.closest('.fila') : null;
      const error = $('error-' + id);
      if (fila) fila.classList.toggle('es-error', !!texto);
      if (campo) {
        if (texto) campo.setAttribute('aria-invalid', 'true');
        else campo.removeAttribute('aria-invalid');
      }
      if (error) error.textContent = texto || '';
    }

    function limpiarErroresCampos() {
      Object.keys(ETIQUETAS_CAMPO).forEach(id => marcarErrorCampo(id, ''));
    }

    function validarRegistro(registro) {
      limpiarErroresCampos();
      let ok = true;
      Object.keys(ETIQUETAS_CAMPO).forEach(id => {
        const valor = id === 'clientes-si' ? registro.clientesSi : registro[id];
        if (!valor) {
          marcarErrorCampo(id, 'Obligatorio');
          ok = false;
        }
      });
      if (registro.telefono && !telefonoValido(registro.telefono)) {
        marcarErrorCampo('telefono', 'Usa entre 7 y 15 dígitos');
        ok = false;
      }
      return ok;
    }

    function guardar() {
      const registro = {
        nombre:        valorDe('nombre'),
        telefono:      valorDe('telefono'),
        ciudad:        valorDe('ciudad'),
        departamento:  $('departamento') ? $('departamento').value : '',
        fuente:        valorDe('fuente'),
        tipo:          valorDe('tipo'),
        conocimientos: $('conocimientos') ? $('conocimientos').value : '',
        clientesSi:    $('clientes-si') ? $('clientes-si').value : '',
        contacto:      $('contacto') ? $('contacto').value : ''
      };

      const msg = $('mensaje');
      if (!validarRegistro(registro)) {
        if (msg) {
          msg.classList.remove('ok');
          msg.classList.add('error');
          msg.textContent = 'Revisa los campos marcados.';
        }
        const primero = document.querySelector('.fila.es-error input, .fila.es-error select');
        if (primero && typeof primero.focus === 'function') primero.focus();
        return false;
      }

      const exceptId = modoEdicion ? idActual : null;
      const repetido = buscarDuplicado(registro, exceptId);
      if (repetido) {
        if (msg) {
          msg.classList.remove('ok');
          msg.classList.add('error');
          msg.textContent = 'Ya existe «' + repetido.registro.nombre + '» con ese teléfono en ' +
            CATEGORIAS[repetido.categoria].plural + '.';
        }
        marcarErrorCampo('telefono', 'Teléfono ya registrado con este nombre');
        return false;
      }

      if (modoEdicion && idActual) {
        const previo = datos[categoriaActual].find(c => c.id === idActual);
        if (previo) {
          registro.propuesta = previo.propuesta || '';
          registro.oferta = previo.oferta || '';
        }
      }

      let guardado;
      if (modoEdicion && idActual) {
        const indice = datos[categoriaActual].findIndex(c => c.id === idActual);
        if (indice === -1) {
          modoEdicion = false;
          guardado = normalizar(registro);
          datos[categoriaActual].push(guardado);
        } else {
          guardado = normalizar(Object.assign({}, datos[categoriaActual][indice], registro));
          datos[categoriaActual][indice] = guardado;
        }
      } else {
        guardado = normalizar(registro);
        datos[categoriaActual].push(guardado);
      }

      const persistido = guardarDatos(opGuardar(categoriaActual, guardado));
      const verbo = modoEdicion ? 'Actualizado' : 'Guardado';

      if (msg) {
        msg.classList.remove('error');
        msg.classList.add('ok');
        msg.textContent = persistido
          ? verbo + ': ' + registro.nombre
          : verbo + ' en esta sesión: ' + registro.nombre + ' (este entorno no permite guardar en el navegador)';
      }

      if (modoEdicion) {
        /* Vuelve al detalle del registro (usa el historial si corresponde). */
        irAtras();
        return false;
      }

      const formulario = $('form-crear');
      if (formulario && typeof formulario.reset === 'function') formulario.reset();
      limpiarErroresCampos();

      return false;
    }

    function copiarTexto(texto, destinoMensaje) {
      const hecho = () => {
        if (!destinoMensaje) return;
        destinoMensaje.classList.remove('error');
        destinoMensaje.classList.add('ok');
        destinoMensaje.textContent = 'Mensaje copiado.';
      };
      const fallar = () => {
        if (!destinoMensaje) return;
        destinoMensaje.classList.remove('ok');
        destinoMensaje.classList.add('error');
        destinoMensaje.textContent = 'No se pudo copiar. Selecciona el texto a mano.';
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(hecho).catch(fallar);
        return;
      }
      try {
        const area = document.createElement('textarea');
        area.value = texto;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        hecho();
      } catch (e) {
        fallar();
      }
    }

    function guardarOfertaDetalle() {
      const cliente = datos[categoriaActual].find(c => c.id === idActual);
      const sel = $('detalle-oferta');
      if (!cliente || !sel) return;
      cliente.oferta = sel.value;
      guardarDatos(opGuardar(categoriaActual, cliente));
      abrirDetalle(cliente.id, { scroll: false });
    }

    function guardarPropuestaDetalle() {
      const cliente = datos[categoriaActual].find(c => c.id === idActual);
      const area = $('detalle-propuesta');
      if (!cliente || !area) return;
      cliente.propuesta = area.value.trim();
      guardarDatos(opGuardar(categoriaActual, cliente));
      abrirDetalle(cliente.id, { scroll: false });
      const msg = $('mensaje-detalle');
      if (msg) {
        msg.classList.remove('error');
        msg.classList.add('ok');
        msg.textContent = 'Propuesta guardada.';
      }
    }

    function pasarACliente() {
      if (categoriaActual !== 'potenciales' || !idActual) return;
      const lista = datos.potenciales;
      const indice = lista.findIndex(c => c.id === idActual);
      if (indice === -1) return;
      const clave = claveDuplicado(lista[indice]);
      if (datos.clientes.some(c => claveDuplicado(c) === clave)) {
        avisoNube('Ya existe un cliente con el mismo nombre y teléfono.');
        return;
      }
      const registro = lista.splice(indice, 1)[0];
      datos.clientes.push(registro);
      /* Guardar con otra categoría = mover la fila en la hoja (mismo id). */
      guardarDatos(opGuardar('clientes', registro));
      categoriaActual = 'clientes';
      abrirDetalle(registro.id);
      const msg = $('mensaje-detalle');
      if (msg) {
        msg.classList.remove('error');
        msg.classList.add('ok');
        msg.textContent = 'Pasó a clientes reales.';
      }
    }

    /* CSV de la categoría abierta (se abre directo en Excel, con tildes). */
    function exportarCsv() {
      const columnas = [
        ['nombre', 'Nombre'], ['telefono', 'Teléfono'], ['ciudad', 'Ciudad'],
        ['departamento', 'Departamento'], ['fuente', 'Fuente'], ['tipo', 'Tipo'],
        ['conocimientos', 'Conocimientos'], ['clientesSi', '¿Ya son clientes?'],
        ['contacto', 'Contacto'], ['oferta', '¿Quiere la oferta?'],
        ['propuesta', 'Propuesta'], ['creado', 'Creado'], ['actualizado', 'Actualizado']
      ];
      const celda = v => {
        let s = String(v == null ? '' : v);
        if (/^[=+\-@]/.test(s)) s = "'" + s;   // evita fórmulas al abrir en Excel
        return '"' + s.replace(/"/g, '""') + '"';
      };
      const filas = [columnas.map(c => celda(c[1])).concat(celda('Mensajes enviados')).join(';')];
      datos[categoriaActual].forEach(r => {
        const res = resumenEnvio(r);
        filas.push(columnas.map(c => celda(r[c[0]]))
          .concat(celda(res.enviados + ' de ' + res.total)).join(';'));
      });
      const blob = new Blob(['﻿' + filas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'objetivos-' + categoriaActual + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportarJson() {
      const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'objetivos-mercado.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    /* ============================================================
       ACCIONES (delegación de eventos: sin onclick en el HTML)
    ============================================================ */
    function ejecutar(accion, arg) {
      switch (accion) {
        case 'categoria':          abrirCategoria(arg); break;
        case 'crear':              irACrear(); break;
        case 'guardados':          abrirGuardados(); break;
        case 'submenu':            volverASubmenu(); break;
        case 'principal':          irA('pantalla-principal'); break;
        case 'atras':              irAtras(); break;
        case 'filtro':
          filtroEnvio = ESTADOS_ENVIO[arg] ? arg : 'todos';
          pintarGuardados();
          break;
        case 'guardar':            guardar(); break;
        case 'editar':             irAEditar(); break;
        case 'pasar-cliente':      pasarACliente(); break;
        case 'exportar':           exportarJson(); break;
        case 'exportar-csv':       exportarCsv(); break;
        case 'eliminar':           pedirEliminar(); break;
        case 'confirmar-eliminar': confirmarEliminar(); break;
        case 'cancelar-eliminar':  cancelarEliminar(); break;
      }
    }

    function activarAcciones() {
      document.addEventListener('click', evento => {
        const elemento = evento.target && evento.target.closest
          ? evento.target.closest('[data-accion]')
          : null;
        if (!elemento) return;

        evento.preventDefault();
        ejecutar(elemento.getAttribute('data-accion'), elemento.getAttribute('data-arg'));
      });

      document.addEventListener('keydown', evento => {
        if (evento.key !== 'Escape') return;
        const confirmacion = $('confirmacion');
        if (confirmacion && !confirmacion.hasAttribute('hidden')) {
          evento.preventDefault();
          cancelarEliminar();
          return;
        }
        /* Escape = volver, salvo mientras se escribe en un campo. */
        const t = evento.target;
        if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
        if (irAtras()) evento.preventDefault();
      });
    }

    function arrancarLocal(conSemilla) {
      datos = cargarLocal(conSemilla);
    }

    /* Si llegan datos nuevos mientras se ve la lista, se repinta. */
    function refrescarVista() {
      const p = pantallaActual();
      if (p === 'pantalla-guardados') pintarGuardados();
      if (p === 'pantalla-potenciales' || p === 'pantalla-clientes') pintarResumenCategoria();
    }

    async function iniciarNube() {
      if (cargandoNube) return;
      cargandoNube = true;
      actualizarEstadoNube('Conectando con Google Sheets…');
      try {
        datos = await cargarNube();
        nubeActiva = true;
        guardarCopiaLocal();
        refrescarVista();
        procesarPendientes();
      } catch (e) {
        nubeActiva = false;
        if (!almacenamientoOk || avisoAlmacen) mostrarAvisoAlmacenamiento();
        avisoNube('No se pudo leer la hoja. Revisa que el script esté publicado como aplicación web. Mientras tanto se usa la última copia de este navegador y los cambios se enviarán al reconectar.');
      } finally {
        cargandoNube = false;
        actualizarEstadoNube();
      }
    }

    /* ============================================================
       ARRANQUE
    ============================================================ */
    function iniciar() {
      prepararFormulario();
      activarAcciones();

      /* Enter guarda, sin depender del envío nativo del formulario
         (algunos visores incrustados lo bloquean). */
      const formulario = $('form-crear');
      if (formulario) {
        formulario.addEventListener('submit', evento => {
          evento.preventDefault();
          guardar();
        });
      }

      const buscar = $('buscar-guardados');
      if (buscar) buscar.addEventListener('input', pintarGuardados);
      const orden = $('orden-guardados');
      if (orden) orden.addEventListener('change', pintarGuardados);

      prepararHistorial();

      almacenamientoOk = probarAlmacenamiento();
      vaciarAlmacen();

      if (nubeConfigurada()) {
        /* Muestra al instante la última copia local; la hoja la reemplaza al llegar. */
        cargarPendientes();
        arrancarLocal(false);
        iniciarNube();
        window.addEventListener('online', () => {
          if (nubeActiva) procesarPendientes();
          else iniciarNube();
        });
        /* Al volver a la pestaña se traen los cambios de otras personas
           (como máximo una vez cada 30 s). */
        let ultimaLectura = Date.now();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible') return;
          if (Date.now() - ultimaLectura < 30000) return;
          ultimaLectura = Date.now();
          iniciarNube();
        });
      } else {
        arrancarLocal(true);
        if (!almacenamientoOk || avisoAlmacen) mostrarAvisoAlmacenamiento();
      }
    }

    iniciar();
  </script>
